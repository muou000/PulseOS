[package]
name = "axfs-io-host"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dev-dependencies]
axdriver_block = { path = "../../modules/axdriver_block", features = ["async"] }
vfs = { path = "../../modules/vfs" }
hadris-io = { version = "=3.0.0-rc.4", default-features = false }
hadris-storage = { version = "=3.0.0-rc.4", default-features = false, features = ["async"] }
kspin = { version = "0.1", features = ["smp"] }
futures-lite = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("file-io-test"))'] }
