[package]
name = "axnet"
version = "0.1.0"
edition = "2021"
authors = ["Yuekai Jia <equation618@gmail.com>", "ChengXiang Qi <kuangjux@outlook.com>"]
description = "ArceOS network module"
license = "GPL-3.0-or-later OR Apache-2.0"
homepage = "https://github.com/rcore-os/arceos"
repository = "https://github.com/rcore-os/arceos/tree/main/modules/axnet"
documentation = "https://rcore-os.github.io/arceos/axnet/index.html"
keywords = ["Starry"]

[features]
monolithic = []

smoltcp = []
multitask = []

# 启用ip协议与否
ip = []

default = ["smoltcp"]

[dependencies]
log.workspace = true
cfg-if.workspace = true
# axnet still depends on the spin 0.9 API; the workspace default is spin 0.10.
spin = "0.9"
axdriver_net.workspace = true
lazyinit.workspace = true
axerrno.workspace = true
axhal.workspace = true
axsync.workspace = true
axtask.workspace = true
axdriver = { workspace = true, features = ["net"] }
axio.workspace = true
axpoll.workspace = true

[dependencies.smoltcp]
workspace = true
features = [
  "alloc", "log",   # no std
  "medium-ethernet",
  "medium-ip",
  "proto-ipv4",
  "proto-ipv6",
  "socket-raw", "socket-icmp", "socket-udp", "socket-tcp", "socket-dns", "proto-igmp",
  # "fragmentation-buffer-size-65536", "proto-ipv4-fragmentation",
  # "reassembly-buffer-size-65536", "reassembly-buffer-count-32",
  # "assembler-max-segment-count-32",
]
