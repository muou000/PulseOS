[workspace]
resolver = "2"
exclude = [
    "crates/ext4plus",
    "crates/buddy-slab-allocator",
    "crates/eevdf-scheduler",
]
members = [
    ".",
    "pulse_syscalls",
    "crates/starry-vdso",
    "crates/pulse_bpf_schema",
    "crates/pulse_user_abi",
    "crates/bpf-capture",
    "crates/bpf-analyzer",
    "crates/compat/axcpu",
    "tools/bpf-record",
    "crates/virtio-drivers",
    "modules/kernel_alloc",
    "modules/config",
    "modules/cpu",
    "modules/display",
    "modules/driver",
    "modules/driver_base",
    "modules/driver_block",
    "modules/driver_display",
    "modules/driver_net",
    "modules/driver_pci",
    "modules/driver_virtio",
    "modules/fs",
    "modules/vfs",
    "modules/hal",
    "modules/io",
    "modules/ipi",
    "modules/kernel_log",
    "modules/mm",
    "modules/net",
    "modules/poll",
    "modules/runtime",
    "modules/sched",
    "modules/sync",
    "modules/task",
    "modules/bpf",
    "modules/elf_loader",
    "modules/ipc",
    "modules/process",
    "api/axfeat",
    "platforms/axplat",
    "modules/io_uring_core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["muou000 <muou000@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/muou000/PulseOS"
repository = "https://github.com/muou000/PulseOS"
documentation = "https://github.com/muou000/PulseOS"
keywords = ["arceos", "kernel", "pulseos"]
categories = ["os", "no-std"]

[workspace.dependencies]
bpf = { path = "modules/bpf" }
elf_loader = { path = "modules/elf_loader" }
ipc = { path = "modules/ipc" }
process = { path = "modules/process" }
pulse_syscalls = { path = "pulse_syscalls" }
pulse_bpf_schema = { path = "crates/pulse_bpf_schema" }
pulse_user_abi = { path = "crates/pulse_user_abi" }
io_uring_core = { path = "modules/io_uring_core" }
bpf-capture = { path = "crates/bpf-capture" }
bpf-analyzer = { path = "crates/bpf-analyzer" }

axfeat = { path = "api/axfeat", features = [
    "alloc-slab",
    "multitask",
    "sched-eevdf",
    "sched-load-balance",
    "fs",
    "rtc",
    "paging",
    "irq",
] }

config = { path = "modules/config" }
hal = { path = "modules/hal", features = ["uspace", "fp-simd"] }
kernel_log = { path = "modules/kernel_log" }
runtime = { path = "modules/runtime" }
net = { path = "modules/net", features = ["monolithic"] }
kernel_alloc = { path = "modules/kernel_alloc", default-features = false }
task = { path = "modules/task" }
sync = { path = "modules/sync" }
fs = { path = "modules/fs", features = ["times"] }
mm = { path = "modules/mm" }
display = { path = "modules/display" }
driver = { path = "modules/driver" }
ipi = { path = "modules/ipi" }
axerrno = "0.2"
poll = { path = "modules/poll" }

driver_base = { path = "modules/driver_base" }
driver_block = { path = "modules/driver_block" }
driver_display = { path = "modules/driver_display" }
driver_net = { path = "modules/driver_net" }
driver_pci = { path = "modules/driver_pci" }
driver_virtio = { path = "modules/driver_virtio" }

axplat-riscv64-qemu-virt = "0.3.0"
axplat-riscv64-visionfive2 = "0.3.0"
axplat-loongarch64-qemu-virt = "0.3.0"
axplat-loongarch64-ls2k1000 = "0.3.0"
axplat-aarch64-qemu-virt = "0.3"
axplat-x86-pc = "0.3"
axplat = { path = "platforms/axplat" }

syscalls = { version = "0.8", default-features = false }
linux-raw-sys = { version = "0.12", default-features = false, features = [
    "no_std",
    "general",
    "net",
    "ioctl",
    "loop_device",
    "io_uring",
] }
io = { path = "modules/io", default-features = false, features = [
    "alloc",
] }
vfs = { path = "modules/vfs" }
linkme = "0.3"
memory_addr = "0.4"
memory_set = "0.4"
bitflags = "2.11"
spin = "0.10"
kernel-elf-parser = "0.3"
xmas-elf = "0.9"
percpu = "0.2"
kernel_guard = "0.1"
rand = { version = "0.9.2", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
rand_pcg = { version = "0.10.2", default-features = false }
chrono = { version = "0.4", default-features = false }
hashbrown = "0.16.1"
kspin = "0.1"
sbi-rt = "0.0.3"
scope-local = "0.1"

starry-vdso = { path = "crates/starry-vdso" }

aarch64-cpu = "10.0"
allocator = { git = "https://github.com/arceos-org/allocator.git", tag = "v0.1.1", default-features = false }
async-lock = { version = "3.4", default-features = false }
async-trait = "0.1"
buddy-slab-allocator = { path = "crates/buddy-slab-allocator" }
axconfig-macros = "0.2"
cpu = { path = "modules/cpu" }
sched = { path = "modules/sched" }
cfg-if = "1.0"
cpumask = "0.1"
crate_interface = "0.1.4"
ctor_bare = "0.2"
env_logger = "0.11.8"
ext4plus = { path = "crates/ext4plus", default-features = false }
hadris-fat = { version = "=3.0.0-rc.4", default-features = false }
hadris-fs = { version = "=3.0.0-rc.4", default-features = false }
hadris-io = { version = "=3.0.0-rc.4", default-features = false }
hadris-storage = { version = "=3.0.0-rc.4", default-features = false }
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
    "async-await-macro",
] }
heapless = "0.9"
intrusive-collections = "0.9.7"
lazyinit = "0.2"
lock_api = { version = "0.4", default-features = false }
log = "=0.4.21"
lru = "0.16.0"
page_table_multiarch = { version = "0.5", features = ["copy-from"] }
slab = { version = "0.4.9", default-features = false }
smoltcp = { git = "https://github.com/rcore-os/smoltcp.git", rev = "8bf9a9a", default-features = false }
timer_list = "0.1"
virtio-drivers = "0.7.4"

[profile.release]
lto = true

[patch.crates-io]
memory_set = { path = "crates/memory_set" }
memory_addr = { path = "crates/memory_addr" }
axcpu = { path = "crates/compat/axcpu" }
axplat-loongarch64-qemu-virt = { path = "platforms/axplat-loongarch64-qemu-virt" }
axplat-loongarch64-ls2k1000 = { path = "platforms/axplat-loongarch64-ls2k1000" }
axplat-riscv64-qemu-virt = { path = "platforms/axplat-riscv64-qemu-virt" }
axplat-riscv64-visionfive2 = { path = "platforms/axplat-riscv64-visionfive2" }
virtio-drivers = { path = "crates/virtio-drivers" }
page_table_multiarch = { path = "crates/page_table_multiarch" }
axplat = { path = "platforms/axplat" }
handler_table = { path = "crates/handler_table" }
dwmmc-host = { path = "crates/dwmmc-host" }
sdmmc-protocol = { path = "crates/sdmmc-protocol" }

[patch."https://github.com/arceos-org/allocator.git"]
allocator = { path = "crates/allocator" }

[package]
name = "Pulse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
net = ["axfeat/net"]
fat = ["pulse_syscalls/fat"]
qemu = [
    "dep:axplat-riscv64-qemu-virt",
    "dep:axplat-loongarch64-qemu-virt",
    "net",
    "axfeat/driver-virtio-net",
]
visionfive2 = [
    "dep:axplat-riscv64-visionfive2",
    "net",
    "axfeat/driver-starfive-jh7110-dwmac",
    "axfeat/driver-starfive-jh7110-sdmmc",
]
ls2k1000 = [
    "dep:axplat-loongarch64-ls2k1000",
    "axfeat/driver-ls2k1000-ahci",
    "hal/ls2k1000",
    "process/ls2k1000",
]
smp = [
    "axfeat/smp",
    "axfeat/ipi",
    "axplat-riscv64-visionfive2?/smp",
    "axplat-loongarch64-ls2k1000?/smp",
]
sched-eevdf = ["axfeat/sched-eevdf"]
sched-load-balance = ["axfeat/sched-load-balance"]
mapping-lifecycle-test = ["process/mapping-lifecycle-test", "pulse_syscalls/mapping-lifecycle-test"]
guest-checks = ["process/guest-checks", "pulse_syscalls/guest-checks"]
file-io-test = ["process/file-io-test", "pulse_syscalls/file-io-test"]
bpf-trace = [
    "axfeat/bpf-trace",
    "task/bpf-trace",
    "process/bpf-trace",
    "pulse_syscalls/bpf-trace",
]

[dependencies]
axerrno.workspace = true
hal.workspace = true
kernel_log.workspace = true
runtime = { workspace = true, features = ["pcp-boot-checks"] }
fs.workspace = true
axfeat.workspace = true
task.workspace = true
sync.workspace = true
net.workspace = true
pulse_syscalls.workspace = true
process.workspace = true
starry-vdso.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
axplat-riscv64-qemu-virt = { workspace = true, optional = true }
axplat-riscv64-visionfive2 = { workspace = true, optional = true, features = ["fp-simd", "irq"] }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
axplat-loongarch64-qemu-virt = { workspace = true, optional = true }
axplat-loongarch64-ls2k1000 = { workspace = true, optional = true, features = ["fp-simd", "irq"] }

[patch."https://github.com/rcore-os/smoltcp.git"]
smoltcp = { path = "crates/smoltcp" }
