[workspace]
resolver = "2"
exclude = [
    "crates/ext4plus",
    "crates/buddy-slab-allocator",
    "crates/eevdf-scheduler",
]
members = [
    ".",
    "pulse_core",
    "pulse_syscalls",
    "crates/starry-vdso",
    "crates/pulse_bpf_schema",
    "crates/bpf-capture",
    "crates/bpf-analyzer",
    "modules/axalloc",
    "modules/axconfig",
    "modules/axcpu",
    "modules/axdisplay",
    "modules/axdriver",
    "modules/axdriver_base",
    "modules/axdriver_block",
    "modules/axdriver_display",
    "modules/axdriver_net",
    "modules/axdriver_pci",
    "modules/axdriver_virtio",
    "modules/axfs",
    "modules/axfs-ng-vfs",
    "modules/axhal",
    "modules/axio",
    "modules/axipi",
    "modules/axlog",
    "modules/axmm",
    "modules/axnet",
    "modules/axpoll",
    "modules/axruntime",
    "modules/axsched",
    "modules/axsync",
    "modules/axtask",
    "api/axfeat",
    "platforms/axplat",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["muou000 <muou000@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/muou000/PulseOS"
repository = "https://github.com/muou000/PulseOS"
documentation = "https://github.com/muou000/PulseOS"
keywords = ["arceos", "kernel", "pulseos"]
categories = ["os", "no-std"]

[workspace.dependencies]
pulse_core = { path = "pulse_core" }
pulse_syscalls = { path = "pulse_syscalls" }
pulse_bpf_schema = { path = "crates/pulse_bpf_schema" }
bpf-capture = { path = "crates/bpf-capture" }
bpf-analyzer = { path = "crates/bpf-analyzer" }

axfeat = { path = "api/axfeat", features = [
    "alloc-slab",
    "multitask",
    "sched-eevdf",
    "sched-load-balance",
    "fs",
    "rtc",
    "paging",
    "irq",
] }

axconfig = { path = "modules/axconfig" }
axhal = { path = "modules/axhal", features = ["uspace", "fp-simd"] }
axlog = { path = "modules/axlog" }
axruntime = { path = "modules/axruntime" }
axnet = { path = "modules/axnet", features = ["monolithic"] }
axalloc = { path = "modules/axalloc", default-features = false }
axtask = { path = "modules/axtask" }
axsync = { path = "modules/axsync" }
axfs = { path = "modules/axfs", features = ["times"] }
axmm = { path = "modules/axmm" }
axdisplay = { path = "modules/axdisplay" }
axdriver = { path = "modules/axdriver" }
axipi = { path = "modules/axipi" }
axerrno = "0.2"
axpoll = { path = "modules/axpoll" }

axdriver_base = { path = "modules/axdriver_base" }
axdriver_block = { path = "modules/axdriver_block" }
axdriver_display = { path = "modules/axdriver_display" }
axdriver_net = { path = "modules/axdriver_net" }
axdriver_pci = { path = "modules/axdriver_pci" }
axdriver_virtio = { path = "modules/axdriver_virtio" }

axplat-riscv64-qemu-virt = "0.3.0"
axplat-riscv64-visionfive2 = "0.3.0"
axplat-loongarch64-qemu-virt = "0.3.0"
axplat-loongarch64-ls2k1000 = "0.3.0"
axplat-aarch64-qemu-virt = "0.3"
axplat-x86-pc = "0.3"
axplat = { path = "platforms/axplat" }

syscalls = { version = "0.8", default-features = false }
linux-raw-sys = { version = "0.12", default-features = false, features = [
    "no_std",
    "general",
    "net",
    "ioctl",
    "loop_device",
] }
axio = { path = "modules/axio", default-features = false, features = [
    "alloc",
] }
axfs-ng-vfs = { path = "modules/axfs-ng-vfs" }
linkme = "0.3"
memory_addr = "0.4"
memory_set = "0.4"
bitflags = "2.11"
spin = "0.10"
kernel-elf-parser = "0.3"
xmas-elf = "0.9"
percpu = "0.2"
kernel_guard = "0.1"
rand = { version = "0.9.2", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
rand_pcg = { version = "0.10.2", default-features = false }
chrono = { version = "0.4", default-features = false }
hashbrown = "0.16.1"
kspin = "0.1"
sbi-rt = "0.0.3"
scope-local = "0.1"

starry-vdso = { path = "crates/starry-vdso" }

aarch64-cpu = "10.0"
allocator = { git = "https://github.com/arceos-org/allocator.git", tag = "v0.1.1", default-features = false }
async-lock = { version = "3.4", default-features = false }
async-trait = "0.1"
buddy-slab-allocator = { path = "crates/buddy-slab-allocator" }
axconfig-macros = "0.2"
axcpu = { path = "modules/axcpu" }
axsched = { path = "modules/axsched" }
cfg-if = "1.0"
cpumask = "0.1"
crate_interface = "0.1.4"
ctor_bare = "0.2"
env_logger = "0.11.8"
ext4plus = { path = "crates/ext4plus", default-features = false }
fatfs = { git = "https://github.com/Starry-OS/rust-fatfs.git", rev = "2685439", default-features = false }
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
    "async-await-macro",
] }
heapless = "0.9"
intrusive-collections = "0.9.7"
lazyinit = "0.2"
lock_api = { version = "0.4", default-features = false }
log = "=0.4.21"
lru = "0.16.0"
page_table_multiarch = { version = "0.5", features = ["copy-from"] }
slab = { version = "0.4.9", default-features = false }
smoltcp = { git = "https://github.com/rcore-os/smoltcp.git", rev = "8bf9a9a", default-features = false }
timer_list = "0.1"
virtio-drivers = "0.7.4"

[profile.release]
lto = true

[patch.crates-io]
axsched = { path = "modules/axsched" }
memory_set = { path = "crates/memory_set" }
memory_addr = { path = "crates/memory_addr" }
axfs-ng-vfs = { path = "modules/axfs-ng-vfs" }
axcpu = { path = "modules/axcpu" }
axplat-loongarch64-qemu-virt = { path = "platforms/axplat-loongarch64-qemu-virt" }
axplat-loongarch64-ls2k1000 = { path = "platforms/axplat-loongarch64-ls2k1000" }
axplat-riscv64-qemu-virt = { path = "platforms/axplat-riscv64-qemu-virt" }
axplat-riscv64-visionfive2 = { path = "platforms/axplat-riscv64-visionfive2" }
axio = { path = "modules/axio" }
axpoll = { path = "modules/axpoll" }
virtio-drivers = { path = "crates/virtio-drivers" }
page_table_multiarch = { path = "crates/page_table_multiarch" }
axplat = { path = "platforms/axplat" }
handler_table = { path = "crates/handler_table" }
dwmmc-host = { path = "crates/dwmmc-host" }
sdmmc-protocol = { path = "crates/sdmmc-protocol" }
axdriver_base = { path = "modules/axdriver_base" }
axdriver_display = { path = "modules/axdriver_display" }

[patch."https://github.com/arceos-org/allocator.git"]
allocator = { path = "crates/allocator" }

[package]
name = "Pulse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
net = ["axfeat/net"]
qemu = [
    "dep:axplat-riscv64-qemu-virt",
    "dep:axplat-loongarch64-qemu-virt",
    "net",
    "axfeat/driver-virtio-net",
]
visionfive2 = [
    "dep:axplat-riscv64-visionfive2",
    "net",
    "axfeat/driver-starfive-jh7110-dwmac",
    "axfeat/driver-starfive-jh7110-sdmmc",
]
ls2k1000 = [
    "dep:axplat-loongarch64-ls2k1000",
    "axfeat/driver-ls2k1000-ahci",
    "axhal/ls2k1000",
    "pulse_core/ls2k1000",
]
smp = [
    "axfeat/smp",
    "axfeat/ipi",
    "axplat-riscv64-visionfive2?/smp",
    "axplat-loongarch64-ls2k1000?/smp",
]
sched-eevdf = ["axfeat/sched-eevdf"]
sched-load-balance = ["axfeat/sched-load-balance"]
mapping-lifecycle-test = ["pulse_core/mapping-lifecycle-test", "pulse_syscalls/mapping-lifecycle-test"]
bpf-trace = [
    "axfeat/bpf-trace",
    "axtask/bpf-trace",
    "pulse_core/bpf-trace",
    "pulse_syscalls/bpf-trace",
]

[dependencies]
axhal.workspace = true
axlog.workspace = true
axruntime.workspace = true
axfs.workspace = true
axfeat.workspace = true
axtask.workspace = true
pulse_syscalls.workspace = true
pulse_core.workspace = true
starry-vdso.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
axplat-riscv64-qemu-virt = { workspace = true, optional = true }
axplat-riscv64-visionfive2 = { workspace = true, optional = true, features = ["fp-simd", "irq"] }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
axplat-loongarch64-qemu-virt = { workspace = true, optional = true }
axplat-loongarch64-ls2k1000 = { workspace = true, optional = true, features = ["fp-simd", "irq"] }

[patch."https://github.com/rcore-os/smoltcp.git"]
smoltcp = { path = "crates/smoltcp" }

[patch."https://github.com/arceos-org/axdriver_crates.git"]
axdriver_base = { path = "modules/axdriver_base" }
axdriver_display = { path = "modules/axdriver_display" }
axdriver_block = { path = "modules/axdriver_block" }
axdriver_net = { path = "modules/axdriver_net" }
axdriver_pci = { path = "modules/axdriver_pci" }
axdriver_virtio = { path = "modules/axdriver_virtio" }
