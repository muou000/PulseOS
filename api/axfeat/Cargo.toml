[package]
name = "axfeat"
version.workspace = true
edition.workspace = true
authors = ["Yuekai Jia <equation618@gmail.com>"]
description = "Top-level feature selection for ArceOS"
license.workspace = true
homepage.workspace = true
repository = "https://github.com/arceos-org/arceos/tree/main/api/axfeat"
documentation = "https://arceos-org.github.io/arceos/axfeat/index.html"

[features]
default = []

# Multicore
smp = ["hal/smp", "runtime/smp", "task?/smp", "kernel_alloc?/smp", "kspin/smp"]

# Floating point/SIMD
fp-simd = ["hal/fp-simd"]

# Interrupts
irq = ["hal/irq", "runtime/irq", "task?/irq", "axdriver?/irq"]
ipi = ["irq", "dep:ipi", "hal/ipi", "runtime/ipi", "task?/ipi"]

# Custom or default platforms
myplat = ["hal/myplat"]
defplat = ["hal/defplat"]

# Memory
alloc = ["kernel_alloc", "runtime/alloc"]
alloc-tlsf = ["kernel_alloc/tlsf"]
alloc-slab = ["kernel_alloc/slab"]
alloc-buddy = ["kernel_alloc/buddy"]
page-alloc-64g = ["kernel_alloc/page-alloc-64g"]                  # up to 64G memory capacity
page-alloc-4g = ["kernel_alloc/page-alloc-4g"]                    # up to 4G memory capacity
paging = ["alloc", "hal/paging", "runtime/paging"]
tls = ["alloc", "hal/tls", "runtime/tls", "task?/tls"]
dma = ["alloc", "paging", "hal/dma"]

# Multi-threading and scheduler
multitask = [
    "alloc",
    "task/multitask",
    "sync/multitask",
    "runtime/multitask",
    "net?/multitask",
    "axdriver?/multitask",
]
sched-fifo = ["task/sched-fifo"]
sched-rr = ["task/sched-rr", "irq"]
sched-cfs = ["task/sched-cfs", "irq"]
sched-eevdf = ["task/sched-eevdf", "irq"]
sched-load-balance = ["task/sched-load-balance"]
bpf-trace = ["task?/bpf-trace"]

# File system
fs = [
    "alloc",
    "paging",
    "axdriver/virtio-blk",
    "axdriver/dyn",
    "dep:fs",
    "runtime/fs",
]

# Networking
net = ["alloc", "paging", "axdriver/net", "dep:net", "runtime/net"]

# Display
display = [
    "alloc",
    "paging",
    "axdriver/virtio-gpu",
    "dep:axdisplay",
    "runtime/display",
    "axdisplay/smoke-test",
]

# Real Time Clock (RTC) Driver.
rtc = ["hal/rtc", "runtime/rtc"]

# Device drivers
bus-mmio = ["axdriver?/bus-mmio"]
bus-pci = ["axdriver?/bus-pci"]
driver-ramdisk = ["axdriver?/ramdisk", "fs?/use-ramdisk"]
driver-virtio-net = ["axdriver?/virtio-net"]
driver-starfive-jh7110-dwmac = ["axdriver?/starfive-jh7110-dwmac"]
driver-bcm2835-sdhci = ["axdriver?/bcm2835-sdhci"]
driver-starfive-jh7110-sdmmc = ["axdriver?/starfive-jh7110-sdmmc"]
driver-ls2k1000-ahci = ["axdriver?/ls2k1000-ahci"]

# Logging
log-level-off = ["kernel_log/log-level-off"]
log-level-error = ["kernel_log/log-level-error"]
log-level-warn = ["kernel_log/log-level-warn"]
log-level-info = ["kernel_log/log-level-info"]
log-level-debug = ["kernel_log/log-level-debug"]
log-level-trace = ["kernel_log/log-level-trace"]

[dependencies]
runtime = { workspace = true }
hal = { workspace = true }
kernel_log = { workspace = true }
kernel_alloc = { workspace = true, optional = true }
axdriver = { workspace = true, optional = true }
fs = { workspace = true, optional = true }
net = { workspace = true, optional = true }
axdisplay = { workspace = true, optional = true }
sync = { workspace = true, optional = true }
task = { workspace = true, optional = true }
ipi = { workspace = true, optional = true }
kspin = { version = "0.1", optional = true }
