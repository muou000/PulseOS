[dependencies.bitflags]
version = "2"

[dependencies.dma-api]
version = "0.9.3"

[dependencies.embedded-hal]
version = "1"

[dependencies.log]
version = "0.4"

[dependencies.rdif-block]
optional = true
version = "0.11.2"

[dependencies.sdio-host2]
version = "0.1.4"

[features]
default = ["spi"]
rdif = ["sdio", "dep:rdif-block"]
sdio = []
spi = []

[lib]
path = "src/lib.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["embedded", "no-std", "hardware-support"]
description = "no_std SD/MMC protocol building blocks for embedded systems"
documentation = "https://docs.rs/sdmmc-protocol"
edition = "2024"
keywords = ["sd", "mmc", "sdio", "embedded", "no_std"]
license = "Apache-2.0"
name = "sdmmc-protocol"
readme = "README.md"
version = "0.4.2"
