[dependencies.unicode-segmentation]
version = "1.9.0"

[dev-dependencies.criterion]
version = "0.5"

[lib]
path = "src/lib.rs"

[package]
authors = ["rutrum <dave@rutrum.net>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["text-processing"]
description = "Convert strings into any case"
edition = "2021"
keywords = ["casing", "case", "string"]
license = "MIT"
name = "convert_case"
readme = "README.md"
repository = "https://github.com/rutrum/convert-case"
version = "0.10.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
