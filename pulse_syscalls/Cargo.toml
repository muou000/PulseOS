[package]
name = "pulse_syscalls"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["irq", "ext4"]
irq = ["task/irq"]
ext4 = ["fs/ext4"]
fat = ["fs/fat"]
bpf-trace = ["task/bpf-trace", "process/bpf-trace"]
mapping-lifecycle-test = ["fs/mapping-lifecycle-test"]
guest-checks = ["process/guest-checks"]
file-io-test = ["fs/file-io-test", "process/file-io-test"]

[dependencies]
bpf.workspace = true
axerrno.workspace = true
io_uring_core.workspace = true
linux-raw-sys = { workspace = true, features = ["system", "prctl", "mempolicy", "io_uring"] }
pulse_bpf_schema = { workspace = true }
pulse_user_abi.workspace = true
spin.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
ipc.workspace = true
cpu.workspace = true
kernel_alloc.workspace = true
mm.workspace = true
hal.workspace = true
kernel_log.workspace = true
task = { workspace = true, features = ["multitask"] }
config.workspace = true
net.workspace = true
io.workspace = true
poll.workspace = true
fs.workspace = true
vfs.workspace = true
linkme.workspace = true
memory_addr.workspace = true
bitflags.workspace = true
kernel_guard.workspace = true
process.workspace = true
starry-vdso.workspace = true
scope-local.workspace = true
rand_core.workspace = true
rand_pcg.workspace = true
chrono.workspace = true
heapless = "0.9"

[target.'cfg(all(target_os = "none", target_arch = "riscv64"))'.dependencies]
syscalls = { workspace = true, features = ["riscv64"] }
sbi-rt = { workspace = true, features = ["legacy"] }

[target.'cfg(all(target_os = "none", target_arch = "loongarch64"))'.dependencies]
syscalls = { workspace = true, features = ["loongarch64"] }
