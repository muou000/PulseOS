[package]
name = "pulse_syscalls"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["irq", "ext4"]
irq = ["axtask/irq"]
ext4 = ["axfs/ext4"]
qperf-trace = ["axtask/qperf-trace", "axfs/qperf-trace"]
mapping-lifecycle-test = ["axfs/mapping-lifecycle-test"]

[dependencies]
axerrno.workspace = true
linux-raw-sys = { workspace = true, features = ["system", "prctl", "mempolicy"] }

[target.'cfg(target_os = "none")'.dependencies]
axalloc.workspace = true
axmm.workspace = true
axhal.workspace = true
axlog.workspace = true
axtask = { workspace = true, features = ["multitask"] }
axconfig.workspace = true
axnet.workspace = true
axio.workspace = true
axpoll.workspace = true
axfs.workspace = true
axfs-ng-vfs.workspace = true
linkme.workspace = true
memory_addr.workspace = true
bitflags.workspace = true
spin.workspace = true
kernel_guard.workspace = true
pulse_core.workspace = true
starry-vdso.workspace = true
scope-local.workspace = true
rand_core.workspace = true
rand_pcg.workspace = true
chrono.workspace = true
heapless = "0.9"

[target.'cfg(all(target_os = "none", target_arch = "riscv64"))'.dependencies]
syscalls = { workspace = true, features = ["riscv64"] }
sbi-rt = { workspace = true, features = ["legacy"] }

[target.'cfg(all(target_os = "none", target_arch = "loongarch64"))'.dependencies]
syscalls = { workspace = true, features = ["loongarch64"] }
