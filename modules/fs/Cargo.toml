[package]
name = "fs"
version.workspace = true
edition.workspace = true
authors = ["Mivik <mivikq@gmail.com>"]
description = "ArceOS filesystem module"
license.workspace = true
homepage.workspace = true

[features]
default = ["ext4"]
use-ramdisk = []       # TODO: init ramdisk
fat = ["dep:hadris-fat", "dep:hadris-fs", "dep:hadris-io", "dep:hadris-storage"]
ext4 = ["dep:ext4plus"]
times = []
std = []
mapping-lifecycle-test = []
file-io-test = ["task/multitask"]
guest-checks = ["driver/guest-checks"]

[dependencies]
kernel_alloc.workspace = true
config.workspace = true
mm.workspace = true
task.workspace = true
driver = { workspace = true, features = ["block", "async"] }
axerrno.workspace = true
vfs.workspace = true
hal.workspace = true
io = { workspace = true, features = ["alloc"] }
kernel_log.workspace = true
poll.workspace = true
sync.workspace = true
bitflags.workspace = true
cfg-if.workspace = true
chrono.workspace = true
intrusive-collections.workspace = true
kspin.workspace = true
log.workspace = true
lru.workspace = true
rand_core.workspace = true
rand_pcg.workspace = true
scope-local.workspace = true
spin.workspace = true
async-trait.workspace = true
async-lock.workspace = true
ext4plus = { workspace = true, features = ["multi-threaded"], optional = true }
hadris-fat = { workspace = true, features = ["async", "alloc"], optional = true }
hadris-fs = { workspace = true, features = ["async", "alloc"], optional = true }
hadris-io = { workspace = true, optional = true }
hadris-storage = { workspace = true, features = ["async"], optional = true }
futures-util.workspace = true
heapless.workspace = true

[dev-dependencies]
driver = { workspace = true, features = ["block", "ramdisk", "async"] }
env_logger.workspace = true
