[package]
name = "bpf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "BPF program execution, object state and sampling queues for PulseOS"

[features]
bpf-trace = ["task/bpf-trace"]

[dependencies]
axerrno.workspace = true
pulse_bpf_schema.workspace = true
spin.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
kernel_alloc.workspace = true
hal.workspace = true
axmm.workspace = true
task = { workspace = true, features = ["multitask"] }
memory_addr.workspace = true
