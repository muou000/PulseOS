[package]
name = "process"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
bpf.workspace = true
elf_loader.workspace = true
ipc.workspace = true
hal = { workspace = true, features = ["paging", "uspace"] }
cpu.workspace = true
kernel_log = { workspace = true }
config = { workspace = true }
kernel_alloc.workspace = true
task = { workspace = true, features = ["multitask"] }
sync = { workspace = true, features = ["multitask"] }
fs.workspace = true
vfs.workspace = true
poll.workspace = true
mm.workspace = true
axerrno.workspace = true
io.workspace = true
net.workspace = true
pulse_bpf_schema = { workspace = true }
io_uring_core.workspace = true
pulse_user_abi.workspace = true

linux-raw-sys = { workspace = true, features = ["io_uring"] }
linkme.workspace = true
memory_addr.workspace = true
kernel_guard.workspace = true
spin.workspace = true
bitflags.workspace = true
percpu.workspace = true
kspin.workspace = true
hashbrown.workspace = true
heapless.workspace = true
sha2 = { version = "0.10", default-features = false, optional = true }

[features]
ls2k1000 = ["cpu/ls2k1000"]
bpf-trace = ["bpf/bpf-trace", "task/bpf-trace", "mm/mapping-observer", "dep:sha2"]
mapping-lifecycle-test = ["fs/mapping-lifecycle-test"]
file-io-test = ["fs/file-io-test"]
guest-checks = []
